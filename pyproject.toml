[project]
name = "resume-screening"
version = "0.1.0"
description = "Explainable AI resume screening and ranking pipeline"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=4.0.0",
  "python-docx>=1.1.0",
  "requests>=2.31.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ai = []
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
